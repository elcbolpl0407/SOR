name: Build Native Executables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install nw-builder
        run: npm install -g nw-builder

      - name: Build Windows x64
        run: nwbuild --platform win --arch x64 --out ./dist .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install nw-builder
        run: npm install -g nw-builder

      - name: Build macOS x64
        run: nwbuild --platform osx --arch x64 --out ./dist .

      - name: Package as DMG
        run: |
          hdiutil create -volname "TuApp" -srcfolder ./dist/nwjs.app -ov -format UDZO ./dist/TuApp.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/*.dmg
